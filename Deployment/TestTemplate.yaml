template:
  name: TestTemplate
  identifier: TestTemplate
  versionLabel: v1
  type: Pipeline
  projectIdentifier: ProjectTemplateTest
  orgIdentifier: default
  tags: {}
  spec:
    stages:
      - stage:
          name: deploydev
          identifier: deploydev
          type: Deployment
          spec:
            deploymentType: Kubernetes
            service:
              serviceRef: dotnetcoreservice
            environment:
              environmentRef: aksdev
              deployToAll: false
              infrastructureDefinitions:
                - identifier: aksinfra
            execution:
              steps:
                - step:
                    name: Rollout Deployment
                    identifier: rolloutDeployment
                    type: K8sRollingDeploy
                    timeout: 10m
                    spec:
                      skipDryRun: false
                      pruningEnabled: false
          failureStrategies:
            - onFailure:
                errors:
                  - AllErrors
                action:
                  type: StageRollback
          rollbackSteps:
            - step:
                name: Rollback Rollout Deployment
                identifier: rollbackRolloutDeployment
                type: K8sRollingRollback
                timeout: 10m
                spec:
                  pruningEnabled: false
